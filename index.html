<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SavePoint Games - Catálogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Filtros</h2>
      <div class="filter-group">
        <h3>Plataforma</h3>
        <label><input type="checkbox" class="filter-check" data-type="plataforma" value="PS5"> PlayStation 5</label>
        <label><input type="checkbox" class="filter-check" data-type="plataforma" value="PC"> PC</label>
        <label><input type="checkbox" class="filter-check" data-type="plataforma" value="Switch"> Nintendo Switch</label>
      </div>
      <div class="filter-group">
        <h3>Gênero</h3>
        <label><input type="checkbox" class="filter-check" data-type="genero" value="RPG"> RPG</label>
        <label><input type="checkbox" class="filter-check" data-type="genero" value="Ação"> Ação</label>
        <label><input type="checkbox" class="filter-check" data-type="genero" value="Indie"> Indie</label>
      </div>
    </aside>

    <main class="content">
      <div class="tags-bar">
        <div id="active-tags"></div>
        <button id="clear-all" class="btn-clear" style="display: none;">Limpar Filtros</button>
      </div>

      <p class="counter">Exibindo <span id="game-count">0</span> jogos</p>
      <div class="games-grid" id="games-grid"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
